# 数值单位：Radius=地面伤害圆半径（游戏世界单位），Cooldown=兼容旧键（忽略）；默认只伤害敌对角色。
# 2.9.11-dev：对当前选中的玩家人形角色施放，允许人形机器人，动物不能施放；Esc取消。
# CastKeyVK 使用 Windows 虚拟键值；85=U，119=F8；只允许 65-90 或 112-123 的整数。
# 键名和值允许空格与行末#或;注释；非法键值保留默认U或之前合法值。修改后重启游戏生效。
# 不要求Ctrl/Shift；文本输入、暂停、加载、非全局输入模式禁止施放；加载结束不会补放按键。
# 四肢必须原生或已安装义肢且当前健康不为负；缺肢/摧毁/死亡/昏迷/离队会中断。
CastKeyVK=85
# 指定地面伤害圆半径350，合法范围5-1000；固定范围圈外缘与伤害判定都直接使用该值。
# 96条裂痕的中心/长度/宽度按旋转后水平外缘同比拟合在圈内；不再乘资产系数扩大伤害范围。
# 收刀时取圈内当前敌对角色；按XZ水平距离判定，坡地/屋顶高度差不缩小圆。
Radius=350
WorldSpeed=0.001
# 演出固定三倍速度，6.7/3=2.233秒；没有冷却，演出中再次按 U 清理后从头重放。
# 实际96条裂痕：每敌人最多96次原生部位判断，每击固定100%武器伤害，收刀集中结算。
# DamageMultiplier仅兼容旧键；旧44或其他数值被忽略，固定使用1，避免96*44误伤。
# 武器是启动条件：只接受游戏攻击时选择的装备栏近战武器，不扫描背包。
# 原生拔刀准备伤害快照失败时拒绝启动；按施放键时冻结伤害，演出中卸下/更换不撤销。
# 结束仅收回本插件拔出的、仍属于本角色且正在手持的同一把武器。
# 玩家所有小队成员（含动物/昏迷者）不受本插件伤害或踉跄；起始队员中途离队仍保护。
# 旧 CutDamage/BluntDamage 固定伤害项已弃用，不能与倍率叠加。
DamageMultiplier=1
# 每敌人命中后优先大踉跄；此倍率仅控制反应力度，不增医疗伤害、不承诺固定硬直秒数。
# 合法范围1-100，死亡/昏迷/倒地跳过；种族无大动作时回退普通动作并记日志。
StaggerForceMultiplier=8
# 无冷却。旧配置的非零 Cooldown 也会被忽略；松开后再次按 U 可覆盖当前演出。
Cooldown=0
# 全范围伤害：MaxTargets仅兼容旧键，非零旧值也忽略，不再截断前32/64人。
MaxTargets=0
DamageEnabled=1
SoundEnabled=1
# 取消演出镜头；0.2.1 也会忽略旧值 1，保留此键兼容旧 DLL。
CinematicCamera=0

# 2.9.3：3独立三片+完整演出（默认）；4仅独立三片；1仅已验收单片；2单片+完整演出；0旧三面。
# 只影响自有特效显示，不改变伤害、按键、动画、相机和时间恢复；重启游戏读取。
OpticalProbeMode=3
